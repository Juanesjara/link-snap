name: CD

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend a EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "/home/ubuntu/link-snap" ]; then
              git clone https://github.com/${{ github.repository }} /home/ubuntu/link-snap
            fi

            cd /home/ubuntu/link-snap
            git pull origin main

            cat > /home/ubuntu/.env << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ENVIRONMENT=production
            BASE_URL=${{ secrets.API_URL }}
            CORS_ORIGINS=${{ secrets.FRONTEND_URL }}
            ENVEOF

            docker rm -f linksnap-backend || true

            docker build -t linksnap-backend ./backend

            docker run -d \
              --name linksnap-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/.env \
              -p 8000:8000 \
              linksnap-backend

            echo "Waiting for backend to start..."
            sleep 10
            curl --fail --retry 8 --retry-delay 3 --retry-all-errors http://localhost:8000/health || \
              (echo "=== CONTAINER LOGS ===" && docker logs linksnap-backend && exit 1)

  deploy-frontend:
    name: Deploy frontend a S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Subir a S3
        run: aws s3 sync frontend/dist s3://linksnap-frontend-599682468486 --delete

      - name: Invalidar caché CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
